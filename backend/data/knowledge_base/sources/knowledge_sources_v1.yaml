# CARE-Psy / psych-ai-companion
# RAG Knowledge Source Registry v1
#
# Purpose:
#   This file is the ONLY allowlist for automatic downloading in the first RAG build.
#   Codex must NOT expand beyond these URLs/domains unless the user edits this registry.
#
# Design:
#   - Public official sources: auto_download=true
#   - Copyrighted books / paid papers / user-owned files: NEVER auto-download;
#     place them in the manual_drop_zones below.
#   - "user_facing=false" means the material may inform policy/safety/system design,
#     but should not be quoted/retrieved as ordinary self-help advice without an
#     explicit routing rule.
#
# Download safety:
#   - Respect robots.txt, site terms, rate limits, redirects, and authentication.
#   - Never bypass paywalls, login, CAPTCHA, access controls, or anti-bot protections.
#   - Only follow download/assets links on the exact official pages below.
#   - Record final URL, HTTP status, SHA256, MIME type, byte size, and downloaded_at.
#
version: 1
registry_name: care_psy_first_rag_sources
created_for: psych-ai-companion
default_language_preference:
  - zh-CN
  - en
default_review_status: pending
default_chunk_review_required: true

paths:
  root: backend/data/knowledge_base
  raw_auto: backend/data/knowledge_base/raw/auto
  raw_manual: backend/data/knowledge_base/raw/manual
  parsed: backend/data/knowledge_base/parsed
  cleaned: backend/data/knowledge_base/cleaned
  chunks_pending: backend/data/knowledge_base/chunks/pending
  chunks_approved: backend/data/knowledge_base/chunks/approved
  chunks_rejected: backend/data/knowledge_base/chunks/rejected
  indexes_chroma: backend/data/knowledge_base/indexes/chroma
  indexes_bm25: backend/data/knowledge_base/indexes/bm25
  reports: backend/data/knowledge_base/reports

manual_drop_zones:
  - id: manual_textbooks
    path: backend/data/knowledge_base/raw/manual/textbooks
    purpose: >
      Legally obtained psychology/counselling/CBT/ACT/MI textbooks or selected chapters.
      Codex must never search for pirated copies. The user places files here manually.
    allowed_extensions: [".pdf", ".docx", ".txt", ".md", ".epub"]
    target_collection: professional_knowledge

  - id: manual_papers
    path: backend/data/knowledge_base/raw/manual/papers
    purpose: >
      Systematic reviews, meta-analyses, guidelines, and papers legally obtained by the user.
      Prefer open-access or institutionally licensed copies supplied by the user.
    allowed_extensions: [".pdf", ".docx", ".txt", ".md"]
    target_collection: evidence

  - id: manual_campus
    path: backend/data/knowledge_base/raw/manual/campus
    purpose: >
      Reviewed university mental-health-center materials and user-authored campus-specific
      knowledge cards for thesis stress, research setbacks, exams, employment, roommates,
      relationships, loneliness, procrastination, perfectionism, and sleep.
    allowed_extensions: [".pdf", ".docx", ".txt", ".md", ".json", ".yaml", ".yml"]
    target_collection: campus_support

  - id: manual_official
    path: backend/data/knowledge_base/raw/manual/official
    purpose: >
      Official WHO/MOE or other registry-listed sources that cannot be automatically fetched
      because of robots.txt, redirects, CAPTCHA, login, or anti-bot controls. Place files under
      raw/manual/official/<source_id>/ so the pipeline can reuse the registry metadata.
    allowed_extensions: [".pdf", ".docx", ".txt", ".md", ".html", ".htm"]
    target_collection: registry_source_target_collection

  - id: manual_cases
    path: backend/data/knowledge_base/raw/manual/cases
    purpose: >
      Licensed/public psychological-support conversation datasets or curated examples.
      These MUST go to Case RAG, not the professional Knowledge RAG.
    allowed_extensions: [".json", ".jsonl", ".csv", ".parquet", ".txt"]
    target_collection: case_rag

collections:
  professional_knowledge:
    description: General psychoeducation and evidence-based low-risk support knowledge.
  interventions:
    description: Actionable self-help techniques and structured exercises.
  helping_skills:
    description: Empathy, listening, collaboration, reflection and safe helping behaviours.
  campus_support:
    description: University-student context, policy and campus-specific support knowledge.
  safety:
    description: Self-harm/suicide safety guidance; routed only by the safety subsystem.
  evidence:
    description: Guidelines/reviews used for evidence checking, not ordinary answer retrieval.
  governance:
    description: Implementation/policy/boundary documents; not ordinary user-facing retrieval.
  case_rag:
    description: Psychological support conversation cases/examples; indexed separately.

