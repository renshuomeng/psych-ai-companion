build_policy:
  download_only_enabled_sources: true
  forbid_unlisted_domains: true
  forbid_search_engine_expansion: true
  forbid_paywall_bypass: true
  forbid_login_bypass: true
  forbid_captcha_bypass: true
  max_concurrent_downloads: 2
  minimum_delay_seconds_per_domain: 1.0
  retries: 2
  request_timeout_seconds: 30
  save_html_pages: true
  save_downloaded_assets: true
  compute_sha256: true
  deduplicate_by_sha256: true
  keep_original_files: true
  unpack_zip_files: true
  retain_zip_after_unpack: true

processing_policy:
  supported_extensions: [".html", ".htm", ".pdf", ".doc", ".docx", ".txt", ".md", ".json", ".jsonl", ".zip"]
  do_not_ocr_unless_needed: true
  remove_navigation_and_boilerplate: true
  preserve_headings: true
  preserve_source_metadata: true
  preserve_section_hierarchy: true
  strip_repeated_headers_footers: true
  strip_page_numbers_when_safe: true
  do_not_index_references_by_default: true
  chunking:
    strategy: heading_paragraph_sentence_then_fallback
    target_chars: 500
    overlap_chars: 80
    min_chars: 120
    max_chars: 900
  review:
    require_review_before_production_index: true
    initial_status: pending
    sample_review_size: 150
  metadata_fields:
    - source_id
    - organization
    - title
    - year
    - source_type
    - target_collection
    - topics
    - language
    - section
    - subsection
    - evidence_level
    - user_facing
    - official_page_url
    - downloaded_url
    - sha256
    - review_status

index_policy:
  first_version:
    dense_vector_store: chromadb
    keyword_index: bm25
    only_index_review_status: [approved]
  collections:
    - professional_knowledge
    - interventions
    - helping_skills
    - campus_support
    - safety
    - evidence
    - governance
    - case_rag
  safety_rules:
    - "Safety collection must be queried only by Risk/Safety routing, never by generic similarity search alone."
    - "Case RAG must remain separate from professional knowledge."
    - "Governance/policy documents must not be treated as user-facing self-help instructions."
    - "A retrieved source must retain exact provenance metadata."
