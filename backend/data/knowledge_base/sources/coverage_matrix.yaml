rating_policy:
  strong:
    min_trusted_source_families: 3
    min_direct_chunks: 12
  adequate:
    min_trusted_source_families: 2
    min_direct_chunks: 5
  weak:
    min_trusted_source_families: 1
    min_direct_chunks: 1
  missing:
    min_trusted_source_families: 0
    min_direct_chunks: 0

retrieval_policy:
  ordinary_advice_allowed:
    user_facing: true
    clinical_only: false
    use_mode:
      - direct_user_support
    risk_scope:
      - normal
      - general
  safety_route_only:
    collection: safety
    use_mode:
      - safety_only
    risk_scope:
      - safety_route_only
  excluded_from_ordinary_retrieval:
    use_mode:
      - safety_only
      - evidence_only
      - clinical_reference_only
      - agent_policy_only
      - helping_skills_only
    clinical_only: true
